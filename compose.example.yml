services:
  silo-server-mcp:
    container_name: silo-server-mcp
    image: ghcr.io/barolinecrewer/silo-server-mcp:latest  # build: . to build from source instead
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8000"   # front with Caddy / Tailscale; don't expose publicly
    env_file:
      - stack.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
